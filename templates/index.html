<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Video</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div class="background-overlay"></div>
    
    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-video fa-3x text-primary mb-3"></i>
                            <h1 class="h2 mb-3">Convertidor de Video</h1>
                            <p class="text-muted">Convierte videos de YouTube a MP3 (audio) o MP4 (video)</p>
                        </div>

                        <form id="converterForm">
                            <div class="mb-3">
                                <label for="url" class="form-label">URL del video de YouTube</label>
                                <input type="text" class="form-control" id="url" 
                                       placeholder="Ej: https://www.youtube.com/watch?v=..." required>
                            </div>

                            <div class="mb-4">
                                <label for="format" class="form-label">Formato de salida</label>
                                <select class="form-select" id="format" required>
                                    <option value="mp3">MP3 (Audio)</option>
                                    <option value="mp4">MP4 (Video)</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-3" id="convertBtn">
                                <span id="btnText">
                                    <i class="fas fa-download me-2"></i>Convertir y Descargar
                                </span>
                                <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
                            </button>
                        </form>

                        <div class="progress mt-4 d-none" id="progressContainer">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                 id="progressBar" style="width: 0%"></div>
                        </div>

                        <div class="alert d-none mt-4 text-center" id="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-white mt-auto py-3">
        <div class="container">
            <p class="mb-0">Creado por Peter Aviles &copy; <span id="currentYear"></span></p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script personalizado -->
    <script src="/static/js/main.js"></script>
</body>
</html>
